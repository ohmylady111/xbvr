name: Publish Chinese Docker image
on:
  push:
    branches: [feat/zh-cn-ui]
    paths: ['Dockerfile.zh', 'deploy/**', 'ui/**', 'pkg/**', 'go.*', 'main.go', 'xbvr_data/**', '.github/workflows/docker-zh.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zh
          load: true
          tags: xbvr-zh:smoke
          build-args: |
            VERSION=zh-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test real container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:9999:9999 xbvr-zh:smoke
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9999/ui/ -o /tmp/index.html; then break; fi
            sleep 2
          done
          test -s /tmp/index.html
          docker exec smoke sh -c 'test -L /config/bin/ffmpeg && /config/bin/ffprobe -version'
          docker exec smoke sh -c 'grep -rl "标签排序" /usr/bin/xbvr >/dev/null'
          docker tag xbvr-zh:smoke ghcr.io/ohmylady111/xbvr:zh-cn-${{ matrix.arch }}
          docker push ghcr.io/ohmylady111/xbvr:zh-cn-${{ matrix.arch }}
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multiarch tags
        run: |
          docker buildx imagetools create -t ghcr.io/ohmylady111/xbvr:zh-cn -t ghcr.io/ohmylady111/xbvr:zh-${{ github.sha }} ghcr.io/ohmylady111/xbvr:zh-cn-amd64 ghcr.io/ohmylady111/xbvr:zh-cn-arm64
          docker buildx imagetools inspect ghcr.io/ohmylady111/xbvr:zh-cn
